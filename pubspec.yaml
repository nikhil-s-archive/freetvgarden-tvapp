name: freetvgarden
description: FreeTvGarden - Free Live TV, Radio, and Webcam Streaming App for Android TV, Mobile, and Web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  video_player: ^2.8.2
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - icons/
